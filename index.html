<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Derby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <header>
            <h1>SIGMA DERBY</h1>
            <div id="coin-display">
                <span id="coins">100</span> QUARTERS
            </div>
        </header>

        <div id="track-container">
            <svg id="track" viewBox="0 0 800 400">
                <!-- Outer rail -->
                <rect x="40" y="40" width="720" height="320" rx="160" ry="160"
                      fill="none" stroke="#8B4513" stroke-width="4"/>
                <!-- Inner rail -->
                <rect x="120" y="100" width="560" height="200" rx="100" ry="100"
                      fill="none" stroke="#8B4513" stroke-width="4"/>
                <!-- Track surface between rails -->
                <rect x="42" y="42" width="716" height="316" rx="158" ry="158"
                      fill="none" stroke="#2d5a1b" stroke-width="76" opacity="0.3"/>
                <!-- Lane lines -->
                <rect x="56" y="54" width="688" height="292" rx="146" ry="146"
                      fill="none" stroke="#3a6b24" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
                <rect x="72" y="68" width="656" height="264" rx="132" ry="132"
                      fill="none" stroke="#3a6b24" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
                <rect x="88" y="82" width="624" height="236" rx="118" ry="118"
                      fill="none" stroke="#3a6b24" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
                <rect x="104" y="96" width="592" height="208" rx="104" ry="104"
                      fill="none" stroke="#3a6b24" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
                <!-- Finish line -->
                <line x1="400" y1="40" x2="400" y2="100" stroke="white" stroke-width="3" stroke-dasharray="6 6"/>
                <text x="400" y="32" text-anchor="middle" fill="#ccc" font-size="12" font-family="monospace">FINISH</text>

                <!-- Infield text -->
                <text x="400" y="190" text-anchor="middle" fill="#5a8a3a" font-size="18" font-family="serif" font-weight="bold" opacity="0.6">SIGMA DERBY</text>
                <text id="race-number-display" x="400" y="215" text-anchor="middle" fill="#5a8a3a" font-size="14" font-family="monospace" opacity="0.5">RACE #1</text>

                <!-- Horses will be positioned by JS -->
            </svg>
        </div>

        <div id="race-status">
            <span id="status-text">PLACE YOUR BETS</span>
            <div id="countdown"></div>
        </div>

        <div id="results-banner" class="hidden">
            <div id="results-content"></div>
        </div>

        <div id="betting-area">
            <h2>QUINELLA ODDS</h2>
            <p class="subtitle">Pick 1st &amp; 2nd place (any order)</p>
            <div id="odds-grid"></div>
            <div id="bet-controls">
                <button id="btn-bet-1" class="bet-btn" data-amount="1">BET 1</button>
                <button id="btn-bet-5" class="bet-btn" data-amount="5">BET 5</button>
                <button id="btn-clear" class="bet-btn clear-btn">CLEAR</button>
                <button id="btn-race" class="race-btn">START RACE</button>
            </div>
        </div>

        <div id="horse-legend">
            <div class="legend-horse" data-horse="0"><span class="horse-color" style="background:#e74c3c"></span> 1. Crimson Bolt</div>
            <div class="legend-horse" data-horse="1"><span class="horse-color" style="background:#3498db"></span> 2. Blue Thunder</div>
            <div class="legend-horse" data-horse="2"><span class="horse-color" style="background:#2ecc71"></span> 3. Green Machine</div>
            <div class="legend-horse" data-horse="3"><span class="horse-color" style="background:#f1c40f"></span> 4. Gold Rush</div>
            <div class="legend-horse" data-horse="4"><span class="horse-color" style="background:#9b59b6"></span> 5. Purple Reign</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
